method.section.title=Update Method
method.migration=Migration (recommended)
method.replace=Replace in-place
method.caption=Only applies to client instances — servers are always updated in-place directly.
method.explanation=Migration: creates a new instance from the current pack and automatically carries over saves & user data; the existing instance is kept as a backup.\n\nReplace in-place: updates the existing instance directly, without creating a new one; user data is preserved where applicable.\n\nServer instances are always updated in-place (mods/config/scripts/libraries are replaced), while world data, backups and the JourneyMapServer UUID are left untouched — a "migration" into a new folder makes no sense for servers.

