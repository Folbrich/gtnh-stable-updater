method.section.title=Update-Methode
method.migration=Migration (empfohlen)
method.replace=In-place ersetzen
method.caption=Gilt nur für Client-Instanzen — Server werden immer gezielt in-place aktualisiert.
method.explanation=Migration: erstellt eine neue Instanz aus dem aktuellen Pack und übernimmt Speicherstände & Nutzerdaten automatisch; die bestehende Instanz bleibt als Backup erhalten.\n\nIn-place ersetzen: aktualisiert die bestehende Instanz direkt an Ort und Stelle, ohne neue Instanz anzulegen; Nutzerdaten bleiben erhalten, wo zutreffend.\n\nServer-Instanzen werden immer gezielt in-place aktualisiert (mods/config/scripts/libraries werden ersetzt), Weltdaten, Backups und die JourneyMapServer-UUID bleiben dabei unangetastet — eine "Migration" mit neuem Ordner ergibt für Server keinen Sinn.

